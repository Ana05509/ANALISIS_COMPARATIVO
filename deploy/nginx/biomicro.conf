# Nginx para BioMicro. Copiar a /etc/nginx/sites-available/biomicro y
# enlazar en sites-enabled. Reemplazar biomicro.utc.edu.ec por el dominio real
# y las rutas del certificado por las que entregue TI (o las de certbot).

upstream biomicro_app {
    server unix:/run/biomicro/gunicorn.sock fail_timeout=0;
}

# Todo lo que llegue por http se manda a https.
server {
    listen 80;
    listen [::]:80;
    server_name biomicro.utc.edu.ec;

    # certbot valida el dominio por aquí.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name biomicro.utc.edu.ec;

    ssl_certificate     /etc/letsencrypt/live/biomicro.utc.edu.ec/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/biomicro.utc.edu.ec/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Los formularios aceptan PDF de hasta 20 MB; el valor por defecto de
    # Nginx (1 MB) cortaría la subida con un error 413.
    client_max_body_size 25M;

    access_log /var/log/nginx/biomicro_access.log;
    error_log  /var/log/nginx/biomicro_error.log;

    # Los reportes PDF/Excel grandes pueden tardar; Gunicorn usa 180 s.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # /static/ lo sirve WhiteNoise desde la app; /media/ NO se sirve desde
    # Nginx a propósito: pasa por Django para exigir sesión y rol
    # (config/urls.py, media_protegida). Un "location /media/ { alias ... }"
    # dejaría los PDF de laboratorio abiertos a cualquiera.
    location / {
        proxy_pass http://biomicro_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
}
