{% extends "templates_base.html" %}

{% block title %}Error del servidor{% endblock %}

{% block content %}
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem;">
    <div class="card" style="max-width:420px; text-align:center; padding:2.5rem 2rem;">
        <div style="width:64px; height:64px; border-radius:50%; background:var(--rojo-light); color:var(--rojo);
                    display:flex; align-items:center; justify-content:center; margin:0 auto 1.25rem; font-size:28px;">
            <i class="ti ti-alert-triangle" aria-hidden="true"></i>
        </div>
        <h1 style="font-family:'Fraunces',serif; font-weight:500; font-size:22px; margin-bottom:.5rem;">
            Algo salió mal
        </h1>
        <p style="color:var(--text-muted); font-size:14.5px; margin-bottom:1.75rem;">
            Ocurrió un error inesperado en el servidor. El equipo de BioSuelo ya fue notificado. Intenta de nuevo en unos minutos.
        </p>
        <a href="/" class="btn btn-primary" style="text-decoration:none;">
            <i class="ti ti-home" aria-hidden="true"></i> Volver al inicio
        </a>
    </div>
</div>
{% endblock %}
