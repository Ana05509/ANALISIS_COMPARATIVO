{% extends "base.html" %}
{% load i18n %}

{% block content %}
<div class="flex min-h-screen items-center justify-center bg-gray-950 px-4 py-12 sm:px-6 lg:px-8">
    <div class="w-full max-w-md space-y-6 rounded-2xl bg-gray-900 p-8 shadow-xl border border-gray-800">
        <!-- Encabezado -->
        <div class="text-center">
            <h2 class="text-3xl font-extrabold tracking-tight text-white">
                Completar Registro
            </h2>
            <p class="mt-2 text-sm text-gray-400">
                Estás a un paso de ingresar a BioMicro usando tu cuenta de Google.
            </p>
        </div>

        <!-- Formulario -->
        <form class="mt-8 space-y-4" method="post" action="{% url 'socialaccount_signup' %}">
            {% csrf_token %}
            
            <div class="space-y-3 text-gray-300">
                {% for field in form %}
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider" for="{{ field.id_for_label }}">
                            {{ field.label }}
                        </label>
                        <!-- Renderizado del input con clases de Tailwind -->
                        {{ field }}
                        {% if field.errors %}
                            <p class="text-xs text-red-500 mt-1">{{ field.errors.as_text }}</p>
                        {% endif %}
                    </div>
                {% endfor %}
            </div>

            <!-- Botón de Envío -->
            <div class="pt-2">
                <button type="submit" class="group relative flex w-full justify-center rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
                    {% trans "Sign Up" %} &rarr;
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
